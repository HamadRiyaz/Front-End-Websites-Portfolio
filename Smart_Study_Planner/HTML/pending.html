<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pending Tasks | Smart Study</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <link rel="stylesheet" href="pending_style.css">

</head>

<body>

    <!-- ================= Sidebar ================= -->

    <aside class="sidebar">

        <div>

            <div class="logo">

                <div class="logo-icon">
                    <i class="fa-solid fa-graduation-cap"></i>
                </div>

                <div>
<h3>Academic Growth</h3>
<p>System</p>
</div>


            </div>

            <span class="menu-title">MENU</span>

            <nav>

                <a href="Dashboard.html">
                    <i class="fa-solid fa-house"></i>
                    Dashboard
                </a>

                <a href="planner.html">
                    <i class="fa-solid fa-calendar-days"></i>
                    Planner
                </a>

                <a href="schedule.html">
                    <i class="fa-solid fa-clock"></i>
                    Daily Schedule
                </a>

                <a class="active" href="#">
                    <i class="fa-solid fa-list-check"></i>
                    Pending Tasks
                </a>

                <a href="focus.html">
                    <i class="fa-solid fa-brain"></i>
                    Focus Mode
                </a>

                <a href="learning.html">
                    <i class="fa-solid fa-route"></i>
                    Learning Path
                </a>

                <a href="performance.html">
                    <i class="fa-solid fa-chart-column"></i>
                    Performance
                </a>

            </nav>

        </div>

        <div class="upgrade-card">

            <h3>Task Manager</h3>

            <p>
                Organize tasks efficiently and never miss a deadline.
            </p>

            <button>Upgrade</button>

        </div>

    </aside>

    <!-- ================= Main ================= -->

    <main class="main-content">

        <!-- Header -->

        <header class="topbar">

            <div>

                <h1>Pending Tasks</h1>

                <p>Manage your assignments and study tasks.</p>

            </div>

            <div class="top-actions">

                <div class="search-box">

                    <i class="fa-solid fa-magnifying-glass"></i>

                    <input type="text"
                        id="searchTask"
                        placeholder="Search task...">

                </div>

                <button class="filter-btn">

                    <i class="fa-solid fa-filter"></i>

                    Filter

                </button>

                <button class="add-btn" id="addTaskBtn">

    <i class="fa-solid fa-plus"></i>

    Add Task

</button>

            </div>

        </header>

        <!-- ================= Pending Task Manager ================= -->

<section class="task-manager">

    <div class="card">

        <div class="section-title">

            <h2>Add New Task</h2>

        </div>

        <div class="task-form">

            <input
                type="text"
                id="taskName"
                placeholder="Enter Task Name">

            <input
                type="date"
                id="dueDate">

            <select id="priority">

                <option value="High">High Priority</option>

                <option value="Medium">Medium Priority</option>

                <option value="Low">Low Priority</option>

            </select>

            <button id="saveTask">

                Save Task

            </button>

        </div>

    </div>


    <div class="card">

        <div class="section-title">

            <h2>Pending Tasks</h2>

        </div>

        <div id="taskList">

        </div>

    </div>

</section>
        

    </main>

    <script src="pending.js"></script>

</body>

</html>
