<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Register - Smart Study Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Poppins,sans-serif}
body{min-height:100vh;display:flex;justify-content:center;align-items:center;background:linear-gradient(135deg,#0f172a,#1e3a8a,#312e81);padding:20px}
.card{width:430px;max-width:100%;background:rgba(255,255,255,.08);backdrop-filter:blur(15px);padding:35px;border-radius:18px;box-shadow:0 20px 50px rgba(0,0,0,.4)}
h1{text-align:center;color:#fff;margin-bottom:8px}
p{text-align:center;color:#cbd5e1;margin-bottom:25px}
.input{position:relative;margin-bottom:18px}
.input i{position:absolute;left:15px;top:16px;color:#60a5fa}
.input input{width:100%;padding:14px 14px 14px 45px;border:none;outline:none;border-radius:10px;background:#1e293b;color:#fff}
button{width:100%;padding:14px;border:none;border-radius:10px;background:linear-gradient(135deg,#2563eb,#4f46e5);color:#fff;font-weight:600;cursor:pointer}
#msg{text-align:center;margin-top:15px;color:#fca5a5}
a{color:#60a5fa;text-decoration:none}
.footer{text-align:center;margin-top:20px;color:#cbd5e1}
</style>
</head>
<body>
<div class="card">
<h1>Create Account</h1>
<p>Student Registration</p>
<form id="registerForm">
<div class="input"><i class="fa fa-user"></i><input id="name" placeholder="Full Name" required></div>
<div class="input"><i class="fa fa-envelope"></i><input id="email" type="email" placeholder="Email" required></div>
<div class="input"><i class="fa fa-lock"></i><input id="password" type="password" placeholder="Password" required></div>
<div class="input"><i class="fa fa-lock"></i><input id="confirm" type="password" placeholder="Confirm Password" required></div>
<button type="submit">Register</button>
</form>
<div id="msg"></div>
<div class="footer">Already have an account? <a href="index.html">Login</a></div>
</div>
<script>
if(!localStorage.getItem("students")){
 localStorage.setItem("students",JSON.stringify([]));
}
document.getElementById("registerForm").addEventListener("submit",function(e){
e.preventDefault();
const name=document.getElementById("name").value.trim();
const email=document.getElementById("email").value.trim();
const password=document.getElementById("password").value;
const confirm=document.getElementById("confirm").value;
const msg=document.getElementById("msg");
msg.style.color="#fca5a5";
if(password!==confirm){msg.textContent="Passwords do not match.";return;}
let students=JSON.parse(localStorage.getItem("students"));
if(students.some(s=>s.email===email)){
 msg.textContent="Email already registered.";
 return;
}
students.push({name,email,password});
localStorage.setItem("students",JSON.stringify(students));
msg.style.color="#86efac";
msg.textContent="Registration successful! Redirecting...";
setTimeout(()=>location.href="index.html",1500);
});
</script>
</body>
</html>
