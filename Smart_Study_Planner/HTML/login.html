<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Smart Study Planner | Login</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{

    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    background:linear-gradient(135deg,#0F172A,#1E293B,#312E81);

    overflow:hidden;

}

.container{

    width:1200px;
    height:700px;

    display:flex;

    border-radius:25px;

    overflow:hidden;

    background:rgba(255,255,255,.08);

    backdrop-filter:blur(18px);

    box-shadow:0 20px 60px rgba(0,0,0,.5);

}

.left{

    width:55%;

    padding:60px;

    display:flex;

    flex-direction:column;

    justify-content:center;

    color:white;

    background:linear-gradient(180deg,#1E40AF,#2563EB,#4338CA);

}

.logo{

    display:flex;

    align-items:center;

    gap:15px;

    margin-bottom:35px;

}

.logo i{

    font-size:55px;

}

.logo h1{

    font-size:35px;

    font-weight:700;

}

.left h2{

    font-size:45px;

    line-height:60px;

    margin-bottom:25px;

}

.left p{

    font-size:18px;

    line-height:34px;

    opacity:.9;

    margin-bottom:40px;

}

.left img{

    width:90%;

    margin:auto;

}

.right{

    width:45%;

    display:flex;

    justify-content:center;

    align-items:center;

    padding:40px;

    background:rgba(15,23,42,.75);

}

.login-card{

    width:100%;

    max-width:420px;

    background:rgba(255,255,255,.08);

    border:1px solid rgba(255,255,255,.1);

    border-radius:20px;

    padding:45px;

    backdrop-filter:blur(15px);

}

.login-card h2{

    color:#fff;

    font-size:34px;

    text-align:center;

    margin-bottom:10px;

}

.login-card p{

    color:#CBD5E1;

    text-align:center;

    margin-bottom:30px;

}

.input-group{

    position:relative;

    margin-bottom:22px;

}

.input-group i{

    position:absolute;

    top:18px;

    left:18px;

    color:#60A5FA;

    font-size:18px;

}

.input-group input{

    width:100%;

    padding:15px 15px 15px 50px;

    border:none;

    outline:none;

    border-radius:12px;

    background:#1E293B;

    color:white;

    font-size:15px;

}

.input-group input::placeholder{

    color:#94A3B8;

}
<button type="submit" class="login-btn">

    Login

</button>

<div id="message"></div>

<div class="register">

    Don't have an account?

    <a href="register.html">

        Register

    </a>

</div>

</form>

</div>

</div>

</div>

<style>

.login-btn{

    width:100%;

    padding:15px;

    border:none;

    outline:none;

    border-radius:12px;

    background:linear-gradient(135deg,#2563EB,#4F46E5);

    color:white;

    font-size:17px;

    font-weight:600;

    cursor:pointer;

    transition:.3s;

}

.login-btn:hover{

    transform:translateY(-2px);

    box-shadow:0 10px 25px rgba(37,99,235,.4);

}

.register{

    margin-top:25px;

    text-align:center;

    color:#CBD5E1;

}

.register a{

    color:#60A5FA;

    text-decoration:none;

    font-weight:600;

}

.register a:hover{

    color:white;

}

#message{

    margin-top:18px;

    text-align:center;

    color:#F87171;

    font-weight:500;

}

@media(max-width:950px){

.container{

    width:95%;

    height:auto;

    flex-direction:column;

}

.left{

    width:100%;

    text-align:center;

    padding:40px;

}

.left img{

    width:70%;

}

.right{

    width:100%;

    padding:30px;

}

.login-card{

    max-width:500px;

}

}

@media(max-width:600px){

.left h2{

    font-size:34px;

    line-height:45px;

}

.left p{

    font-size:15px;

}

.logo h1{

    font-size:28px;

}

.login-card{

    padding:30px;

}

}

</style>

</head>

<body>

<div class="container">

<div class="left">

<div class="logo">

<i class="fa-solid fa-graduation-cap"></i>

<h1>Study Planner</h1>

</div>

<h2>

Plan Smart.<br>

Study Better.

</h2>

<p>

Manage your planner, quizzes, assignments,
daily schedule and academic performance
all in one place.

</p>

<img src="images/study.png" alt="Study">

</div>

<div class="right">

<div class="login-card">

<h2>Welcome Back</h2>

<p>Login to continue</p>

<form id="loginForm">

<div class="input-group">

<i class="fa-solid fa-user"></i>

<input
type="text"
id="username"
placeholder="Username or Email"
required>

</div>

<div class="input-group">

<i class="fa-solid fa-lock"></i>

<input
type="password"
id="password"
placeholder="Password"
required>

</div>
